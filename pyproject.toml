[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["src/**/*"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "labelmaker"
version = "0.2.0"
description = "Labelmaker is a labeling pipeline in MLExchange"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

dependencies = [
    "dash==2.9.3",
    "dash[diskcache]",
    "dash_bootstrap_components==1.0.2",
    "dash_daq==0.5.0",
    "dash-extensions==0.0.71",
    "dask>=2024.3.0",
    "dask-expr==1.0.10",
    "flask==3.0.0",
    "Flask-Caching",
    "humanhash3",
    "mlex_file_manager@git+https://github.com/mlexchange/mlex_file_manager",
    "numpy>=1.19.5",
    "pandas",
    "Pillow",
    "pyFAI==2023.9.0",
    "python-dotenv",
    "requests==2.26.0",
    "diskcache==5.6.3",
    "tiled[client]>=0.1.0a118",
]

[project.optional-dependencies]
dev = [
    "black==24.2.0",
    "flake8==7.0.0",
    "isort==5.13.2",
    "pre-commit==3.6.2",
    "pytest==8.1.1",
]
